<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оборудование дата-центра — Плитка</title>
    <link rel="stylesheet" href="/static/styles/base.css">
    <link rel="stylesheet" href="/static/styles/tile.css">
</head>
<body>
<div class="screen">
    <header class="topbar">
        <span>ЦОД · Учёт оборудования</span>
    </header>

    <form class="filter-form" action="/devices" method="GET">
        <input type="number" name="power" min="0" placeholder="Мин. мощность, Вт" value="{{.power}}">
        <button type="submit">Найти</button>
    </form>

    {{if .devices}}
    <div class="device-grid">
        {{range .devices}}
        <a class="device-card" href="/feed/{{.ID}}">
            <img src="{{.ImageURL}}" alt="{{.Name}}">
            <div class="info">
                <div class="name">{{.Name}}</div>
                <div class="meta">
                    <span>❤ {{.LikesCount}}</span>
                    <span class="power">{{.PowerConsumptionW}} Вт</span>
                </div>
            </div>
        </a>
        {{end}}
    </div>
    {{else}}
    <p class="empty">Оборудование не найдено</p>
    {{end}}

    {{template "nav" .}}
</div>
</body>
</html>
