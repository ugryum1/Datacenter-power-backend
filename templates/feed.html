<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .device}}{{.device.Name}}{{else}}Лента{{end}} — ЦОД</title>
    <link rel="stylesheet" href="/static/styles/base.css">
    <link rel="stylesheet" href="/static/styles/feed.css">
</head>
<body>
<div class="screen">
    <header class="topbar">
        <span>ЦОД · Лента оборудования</span>
    </header>

    <div class="screen-content">
        {{if .error}}
        <p class="empty">{{.error}}</p>
        {{else}}
        <div class="feed-frame">
            <video src="{{.device.VideoURL}}" autoplay loop muted playsinline></video>
            <div class="feed-overlay">
                <h1>{{.device.Name}}</h1>
                <details>
                    <summary>Подробнее</summary>
                    {{.device.ShortDescription}}
                </details>
                <div class="feed-fields">
                    <div class="field">Мощность<b>{{.device.PowerConsumptionW}} Вт</b></div>
                    <div class="field">Тепловыделение<b>{{.device.HeatDissipationBTU}} БТЕ/ч</b></div>
                </div>
                <div class="feed-actions">
                    <span class="like-badge"><span class="heart">❤</span> {{.likes}}</span>
                    <a class="btn-next" href="/feed/{{.device.ID}}?next=true">Следующий</a>
                </div>
            </div>
        </div>
        {{end}}
    </div>

    {{template "nav" .}}
</div>
</body>
</html>
