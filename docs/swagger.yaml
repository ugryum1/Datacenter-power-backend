basePath: /api
definitions:
  ds.DatacenterDeviceCardSerializer:
    properties:
      heat_dissipation_btu:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_creator:
        type: integer
      likes_count:
        type: integer
      name:
        type: string
      power_consumption_w:
        type: integer
      short_description:
        type: string
      video_url:
        type: string
    type: object
  ds.DatacenterDeviceLikeRequest:
    properties:
      like:
        enum:
        - 0
        - 1
        type: integer
    required:
    - like
    type: object
  ds.DatacenterDevicePublishRequest:
    properties:
      heat_dissipation_btu:
        type: integer
      name:
        type: string
      power_consumption_w:
        type: integer
      short_description:
        type: string
    required:
    - heat_dissipation_btu
    - name
    - power_consumption_w
    - short_description
    type: object
  ds.DatacenterDeviceSerializer:
    properties:
      heat_dissipation_btu:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      likes_count:
        type: integer
      name:
        type: string
      power_consumption_w:
        type: integer
      short_description:
        type: string
      video_url:
        type: string
    type: object
  ds.DatacenterEngineer:
    properties:
      id:
        type: integer
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
  ds.DatacenterEngineerSignInRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  ds.DatacenterEngineerSignInResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  ds.DatacenterEngineerSignUpRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
host: localhost:8080
info:
  contact: {}
  description: Расчёт потребляемой датацентром электроэнергии по установленному оборудованию
  title: Datacenter Power API
  version: "1.0"
paths:
  /datacenter-engineers/sign-in:
    post:
      consumes:
      - application/json
      description: 'Возвращает JWT для заголовка Authorization: Bearer <access_token>'
      parameters:
      - description: Логин и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.DatacenterEngineerSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterEngineerSignInResponse'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
      summary: Аутентификация инженера
      tags:
      - datacenter-engineers
  /datacenter-engineers/sign-out:
    post:
      description: Добавляет текущий JWT в блеклист Redis
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Деавторизация инженера
      tags:
      - datacenter-engineers
  /datacenter-engineers/sign-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.DatacenterEngineerSignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ds.DatacenterEngineer'
        "400":
          description: Bad Request
      summary: Регистрация инженера
      tags:
      - datacenter-engineers
  /datacenter-equipment:
    get:
      description: is_creator = 1, если устройство создал авторизованный инженер
      parameters:
      - description: Мощность от, Вт
        in: query
        name: power
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ds.DatacenterDeviceCardSerializer'
            type: array
      summary: Список опубликованных устройств
      tags:
      - datacenter-equipment
    post:
      consumes:
      - multipart/form-data
      description: Создаёт черновик текущего инженера, файлы сохраняются в MinIO
      parameters:
      - description: Название устройства
        in: formData
        name: name
        required: true
        type: string
      - description: Фото (jpeg, png, webp)
        in: formData
        name: image
        required: true
        type: file
      - description: Видео (webm, mp4)
        in: formData
        name: video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceSerializer'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Добавление устройства с фото и видео
      tags:
      - datacenter-equipment
  /datacenter-equipment/{id}:
    delete:
      parameters:
      - description: id устройства
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Логическое удаление устройства текущего инженера
      tags:
      - datacenter-equipment
  /datacenter-equipment/{id}/like:
    post:
      consumes:
      - application/json
      description: like = 1 ставит лайк, like = 0 снимает
      parameters:
      - description: id устройства
        in: path
        name: id
        required: true
        type: integer
      - description: Лайк
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.DatacenterDeviceLikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceSerializer'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Лайк устройства от текущего инженера
      tags:
      - datacenter-equipment
  /datacenter-equipment/{id}/publish:
    put:
      consumes:
      - application/json
      parameters:
      - description: id черновика
        in: path
        name: id
        required: true
        type: integer
      - description: Поля устройства
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.DatacenterDevicePublishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceSerializer'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Публикация черновика устройства
      tags:
      - datacenter-equipment
  /datacenter-equipment/draft:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceSerializer'
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Черновик устройства текущего инженера
      tags:
      - datacenter-equipment
  /datacenter-equipment/reel:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceCardSerializer'
        "404":
          description: Not Found
      summary: Первое устройство ленты
      tags:
      - datacenter-equipment
  /datacenter-equipment/reel/{id}:
    get:
      description: При next=true возвращается следующее устройство после id
      parameters:
      - description: id устройства
        in: path
        name: id
        required: true
        type: integer
      - description: true — следующее устройство
        in: query
        name: next
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.DatacenterDeviceCardSerializer'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Устройство ленты по id
      tags:
      - datacenter-equipment
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'Значение заголовка: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
